name: agentbazaar
x-app: &app
  build: .
  env_file: .env
  environment: &environment
    DATABASE_URL: postgresql://agentbazaar:agentbazaar_local@db:5432/agentbazaar
    APP_URL: http://localhost:5173
    NODE_ENV: development
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentbazaar
      POSTGRES_PASSWORD: agentbazaar_local
      POSTGRES_DB: agentbazaar
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentbazaar -d agentbazaar"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]
  backend:
    <<: *app
    command: ["node", "dist/server/server/index.js"]
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    <<: *app
    command: ["npm", "run", "dev:web", "--", "--host", "0.0.0.0"]
    environment:
      <<: *environment
      API_PROXY_TARGET: http://backend:4000
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [backend]
  worker:
    <<: *app
    command: ["node", "dist/server/server/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres:
