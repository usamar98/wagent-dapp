name: wagent-ai
x-app: &app
  build: .
  env_file: .env.supabase.local
  environment: &environment
    APP_URL: http://localhost:5173
    NODE_ENV: development
services:
  backend:
    <<: *app
    command: ["node", "dist/server/server/index.js"]
    ports: ["127.0.0.1:4000:4000"]
  frontend:
    <<: *app
    command: ["npm", "run", "dev:web", "--", "--host", "0.0.0.0"]
    environment:
      <<: *environment
      API_PROXY_TARGET: http://backend:4000
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [backend]
  worker:
    <<: *app
    command: ["node", "dist/server/server/worker.js"]
